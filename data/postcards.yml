# Post Cards — one entry per batch of cards posted, newest first on /post-cards/.
# date:         month and year it was posted, as YYYY-MM
# code:         the post office code (PIN or postal code) of where it was posted
# location:     the place
# sent:         how many cards went out
# type:         optional, `greeting` for a greeting card (shown in white-grey, without the PIN boxes); leave out for a post card
# note:         optional, a few lines about the day, shown on the left of the card
# received:     how many cards the receiver has acknowledged (shown first, as received/sent)
