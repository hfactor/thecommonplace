# Content types — drives the Explore panel navigation and JS rendering.
# id:            URL slug and filter key
# in_everything: whether this type's entries appear in the Everything feed
# in_dropdown:   whether this type appears in the Explore/section dropdown
#                (independent of in_everything — Life Logs is in the feed
#                but not offered as a filter option)
# card_template: named rendering template — book | browser | product | notebook
# view_mode:     dedicated page view — card | gallery
# on_click:      what happens when a card/row is clicked — sheet | external | page
# group_by:      card-view grouping — month | category | none
# list_group_by: list-view grouping — defaults to group_by when omitted; set
#                separately when a type should group differently per view
#                (e.g. Life Logs groups by month in card view but not list view)
#
# Order here also drives the Everything type-dropdown order (after "Everything"
# itself, which is hardcoded first in page-title.html): Reading, Projects, Notes,
# Bookmarks, Uses.

- id: reading
  label: Reading
  in_everything: true
  in_dropdown: true
  card_template: book
  view_mode: card
  on_click: sheet
  group_by: month

- id: projects
  label: Projects
  in_everything: true
  in_dropdown: true
  card_template: product
  view_mode: gallery
  on_click: page
  group_by: none

- id: notes
  label: Notes
  in_everything: true
  in_dropdown: true
  card_template: notebook
  view_mode: gallery
  on_click: page
  group_by: none

- id: bookmarks
  label: Bookmarks
  in_everything: true
  in_dropdown: true
  card_template: browser
  view_mode: card
  on_click: sheet
  group_by: month

- id: uses
  label: Uses
  in_everything: true
  in_dropdown: true
  card_template: product
  view_mode: gallery
  on_click: sheet
  group_by: category

- id: lifelog
  label: Life Logs
  in_everything: true
  in_dropdown: false
  card_template: lifelog
  view_mode: card
  on_click: page
  group_by: month
  list_group_by: none

- id: lists
  label: Lists
  in_everything: true
  in_dropdown: false
  card_template: lists
  view_mode: gallery
  on_click: page
  group_by: none
