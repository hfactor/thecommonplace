baseURL = "https://hiran.in"
locale = "en-us"
title = "Hiran Venugopalan"
enableRobotsTXT = true
disableKinds = ["taxonomy"]

ignoreFiles = [
  "/content/notes/.obsidian/.*",
  "/content/notes/00-Inbox/.*",
  "/content/notes/30-Log/.*",
  "/content/notes/40-Private/.*",
  "/content/notes/AGENTS\\.md"
]

# Notebooks are not their own content — a notebook is just a distinct value
# of a note's `categories` field. Hugo's taxonomy system auto-generates one
# page per category, appearing/disappearing as notes are added, renamed, or
# removed — no separate file to hand-maintain in sync.
[taxonomies]
  category = "categories"

[permalinks]
  notes     = "/note/:slug"
  categories = "/note/:slug"
  reading   = "/reading/:slug"
  bookmarks = "/bookmarks/:slug"

[params]
  tagline       = "Product Designer"
  description   = "Personal website of Hiran Venugopalan, product designer based in Bengaluru, India. Fifteen years designing products, building teams, and working across design, FOSS, and typography."
  keywords      = "product designer, UX design, open source design, FOSS, Malayalam typography, typeface designer, Bengaluru, India, Hiran Venugopalan"
  ogImage       = "/img/og-image.png"
  twitterHandle = "hfactor"

  [params.sections.notes]
    render = true
  [params.sections.projects]
    render = true
  [params.sections.reading]
    render = true
  [params.sections.bookmarks]
    render = true
  [params.sections.uses]
    render = true
  [params.sections.work]
    render = true

[outputFormats.SectionData]
  mediaType = "application/json"
  baseName = "data"
  isPlainText = true
  notAlternative = true

[outputFormats.PlainResume]
  mediaType = "text/markdown"
  baseName = "resume"
  isPlainText = true
  notAlternative = true

[outputs]
  home    = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
