    </div>
    {{- if .footerHover }}
    <div class="site-footer-dock" id="footerDock">
      <button type="button" class="footer-toggle-btn" id="footerToggleBtn" aria-label="Menu" aria-expanded="false">⌘</button>
      {{ partial "site-footer.html" .page }}
    </div>
    <script>
    (function () {
      var dock = document.getElementById('footerDock');
      var btn  = document.getElementById('footerToggleBtn');
      if (!dock || !btn) return;
      function close() { dock.classList.remove('is-open'); btn.setAttribute('aria-expanded', 'false'); }
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var open = dock.classList.toggle('is-open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      dock.querySelectorAll('.sf-link:not(.pt-nav-toggle), .pt-nav-link').forEach(function (link) {
        link.addEventListener('click', close);
      });
      document.addEventListener('click', function (e) {
        if (dock.classList.contains('is-open') && !dock.contains(e.target)) close();
      });
    })();
    </script>
    {{- else }}
    {{ partial "site-footer.html" .page }}
    {{- end }}
  </div>
</div>
