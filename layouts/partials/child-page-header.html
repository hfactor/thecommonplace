{{/* dict: backHref, backLabel, title, titleHref (optional — external link, projects only) */}}
<div class="proj-page-hdr">
  <a class="proj-back" href="{{ .backHref }}" aria-label="{{ .backLabel }}">
    <svg width="7" height="12" viewBox="0 0 7 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,1 1,6 6,11"/></svg>
  </a>
  {{- if .titleHref -}}
  <a class="page-title proj-page-title proj-page-title--link" href="{{ .titleHref }}" target="_blank" rel="noopener">{{ .title }}</a>
  {{- else -}}
  <h1 class="page-title proj-page-title">{{ .title }}</h1>
  {{- end -}}
</div>
