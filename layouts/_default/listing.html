{{ define "main" }}
{{ if .Params.listingType }}
  {{ partial "section-page.html" . }}
{{ else }}
  {{ partial "card-page.html" . }}
{{ end }}
<script>
window.__LISTING__ = {
  type:     {{ with .Params.listingType }}{{ . | jsonify | safeJS }}{{ else }}null{{ end }},
  filters:  {{ with .Params.filters }}{{ . | jsonify | safeJS }}{{ else }}{}{{ end }},
  listOnly: {{ if .Params.listOnly }}true{{ else }}false{{ end }}
};
</script>
{{ end }}
